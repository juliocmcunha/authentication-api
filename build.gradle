plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.portfolio'
version = '1.0.0'
description = 'OAuth2 authentication and role-based access control demo (portfolio project)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Core web + security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // OAuth2 Resource Server (brings in the Nimbus JOSE/JWT stack used to sign & verify tokens)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Persistence (H2 in-memory database for a self-contained demo)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'

    // Bean validation for the token endpoint payloads
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Health/metrics endpoints — a nice touch for a portfolio project
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Interactive API docs at /swagger-ui.html
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Convenience: `./gradlew run` behaves like `./gradlew bootRun`
tasks.register('run') {
    dependsOn 'bootRun'
    group = 'application'
    description = 'Alias for bootRun'
}
